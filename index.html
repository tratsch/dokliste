<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Doko">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Doppelkopf Liste</title>
  <script src="config.js"></script>
  <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap');
      :root{
          --bg:#f4f6f9;--bg2:#fff;--bg3:#eef1f5;
          --border:#dde3ea;--border2:#c8d0da;
          --text:#1a2332;--muted:#7a8fa6;
          --accent:#d62f3b;
          --safe-top:env(safe-area-inset-top,0px);
          --safe-bot:env(safe-area-inset-bottom,0px);
      }
      *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
      html,body{height:100%;overflow:hidden;}
      body{background:var(--bg);color:var(--text);
          font-family:'DM Mono','Courier New',monospace;font-size:1.0625rem;
          display:flex;flex-direction:column;}
      #app{flex:1;overflow:hidden;display:flex;flex-direction:column;}
      #hdr{padding:calc(var(--safe-top) + 18px) 16px 18px;background:var(--bg2);
          border-bottom:1px solid var(--border);display:flex;align-items:center;
          justify-content:space-between;flex-wrap:wrap;gap:10px;flex-shrink:0;box-shadow:0 1px 4px rgba(0,0,0,.06);}
      #hdr h1{font-family:'Syne',sans-serif;font-size:1.75rem;font-weight:800;color:var(--text);}
      #hdr h1 span{color:var(--accent);}
      .sub{font-size:0.8125rem;color:var(--muted);}
      #sync-btn{background:transparent;border:1px solid var(--border2);color:var(--muted);
          padding:4px 10px;border-radius:4px;font-family:inherit;font-size:0.8125rem;cursor:pointer;}
      #sync-btn.syncing{color:var(--accent);border-color:var(--accent);animation:pulse 1s infinite;}
      #filterbar{display:flex;align-items:center;justify-content:space-between;gap:8px;
          padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
      #filterbar[hidden]{display:none;}
      #filter-status{font-size:0.8125rem;color:var(--muted);}
      #participation-filter{white-space:nowrap;padding:6px 10px;}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
      #views{flex:1;overflow:hidden;position:relative;}
      .view{position:absolute;inset:0;overflow-y:auto;padding:14px;display:none;
          -webkit-overflow-scrolling:touch;}
      .view.active{display:block;}
      #nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);
          padding-bottom:var(--safe-bot);flex-shrink:0;box-shadow:0 -1px 4px rgba(0,0,0,.06);}
      .nb{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
          padding:8px 4px;background:transparent;border:none;cursor:pointer;
          color:var(--muted);font-family:inherit;font-size:0.75rem;line-height:1.25;transition:color .15s;}
      .nb span{max-width:100%;}
      .nb.on{color:var(--accent);}
      .nb svg{width:20px;height:20px;stroke-width:1.8;}
      .card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
          padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
      .ct{font-family:'Syne',sans-serif;font-weight:700;font-size:1.0625rem;
          color:var(--text);margin-bottom:10px;}
      .cs{font-size:0.8125rem;color:var(--muted);margin-bottom:12px;margin-top:-6px;}
      .stabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;}
      .stab{background:transparent;border:1px solid var(--border2);color:var(--muted);
          padding:4px 10px;border-radius:4px;font-family:inherit;font-size:0.8125rem;cursor:pointer;}
      .stab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
      .rrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
      .rrow:last-child{border-bottom:none;}
      .rnum{font-size:0.875rem;color:var(--muted);min-width:22px;text-align:right;}
      .rname{font-weight:600;font-size:1.0625rem;flex:1;min-width:0;overflow-wrap:anywhere;}
      .ravg{font-size:1.0625rem;font-weight:700;white-space:nowrap;}
      .rgms{font-size:0.8125rem;color:var(--muted);min-width:50px;text-align:right;}
      .rbar{height:3px;background:var(--border);border-radius:2px;margin-top:3px;overflow:hidden;}
      .rbfill{height:100%;border-radius:2px;}
      .row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);}
      .row:last-child{border-bottom:none;}
      .round-games{text-align:right;}
      @media(max-width:480px){
          .round-score{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:4px 8px;}
          .round-score>span:first-child{grid-row:1 / 3;}
          .round-score>span:nth-child(2){grid-column:2;min-width:0;overflow-wrap:anywhere;}
          .round-score>span:nth-child(3){grid-column:3;grid-row:1;}
          .round-score>span:nth-child(4){grid-column:2;grid-row:2;text-align:left;}
          .round-score>span:nth-child(5){grid-column:3;grid-row:2;}
      }
      .cwrap{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
          padding:12px 6px 6px;margin-bottom:10px;}
      canvas{display:block;max-width:100%;}
      .cleg{display:flex;flex-wrap:wrap;gap:6px;padding:8px 6px 2px;}
      .chip{font-size:0.8125rem;padding:2px 8px;border-radius:20px;border:1px solid;cursor:pointer;}
      .chip.off{opacity:.3;}
      .btn{width:100%;padding:11px;border-radius:8px;border:none;
          font-family:inherit;font-size:1.0625rem;font-weight:600;cursor:pointer;}
      .btn+.btn{margin-top:8px;}
      .btn-p{background:var(--accent);color:#fff;}
      .btn-p:active{opacity:.85;}
      .btn-p:disabled{opacity:.55;cursor:default;}
      .btn-s{background:var(--bg3);color:var(--muted);border:1px solid var(--border2);}
      .round-actions{display:flex;gap:8px;margin-top:12px;}
      .round-actions .btn{flex:1;width:auto;padding:8px;font-size:0.875rem;margin:0;}
      .btn-danger{color:var(--accent);}
      button:disabled{opacity:.55;cursor:default;}
      .fl{display:block;font-size:0.8125rem;color:var(--muted);margin-bottom:4px;
          text-transform:uppercase;letter-spacing:.5px;}
      .fi,.fsel{width:100%;background:var(--bg3);border:1px solid var(--border2);
          color:var(--text);padding:9px 12px;border-radius:6px;font-family:inherit;font-size:1rem;}
      .fi:focus,.fsel:focus{outline:none;border-color:var(--accent);}
      .per{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
          padding:10px 12px;margin-bottom:8px;}
      .per-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
      .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
      .pname{font-weight:600;font-size:1rem;flex:1;}
      .tog{background:var(--bg2);color:var(--muted);border:1px solid var(--border2);
          border-radius:5px;padding:3px 8px;font-size:0.8125rem;cursor:pointer;font-family:inherit;}
      .tog.on{background:var(--accent);color:#fff;border-color:var(--accent);}
      .pflds{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
      .pflds.hide{display:none;}
      .pfl{font-size:0.75rem;color:var(--muted);margin-bottom:3px;}
      .pfi{width:100%;background:var(--bg2);border:1px solid var(--border2);
          color:var(--text);padding:6px 8px;border-radius:5px;font-family:inherit;font-size:1.125rem;text-align:center;}
      .pfi:focus{outline:none;border-color:var(--accent);}
      .pin-wrap{display:flex;align-items:center;justify-content:center;padding:40px 0;}
      .pin-box{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
          padding:28px 24px;width:280px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
      .pin-box h2{font-family:'Syne',sans-serif;font-size:1.25rem;margin-bottom:14px;}
      .pini{width:100%;background:var(--bg3);border:1px solid var(--border2);
          color:var(--text);padding:10px 12px;border-radius:6px;font-family:inherit;
          font-size:1.4375rem;letter-spacing:8px;text-align:center;margin-bottom:10px;}
      .pini:focus{outline:none;border-color:var(--accent);}
      .perr{font-size:0.875rem;color:var(--accent);text-align:center;min-height:14px;margin-bottom:8px;}
      #toast{position:fixed;bottom:calc(68px + var(--safe-bot));left:50%;
          transform:translateX(-50%) translateY(20px);background:var(--bg2);
          border:1px solid var(--border2);border-radius:8px;padding:10px 18px;
          font-size:1rem;opacity:0;transition:all .25s;pointer-events:none;max-width:calc(100vw - 28px);width:max-content;
          z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.1);}
      #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
      #toast.err{border-color:var(--accent);color:var(--accent);}
      #toast.ok{border-color:#3d8a4e;color:#2d7a3a;}
      .sp{display:inline-block;width:18px;height:18px;border:2px solid var(--border2);
          border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;}
      @keyframes spin{to{transform:rotate(360deg)}}
      .ld{display:flex;align-items:center;justify-content:center;gap:10px;
          padding:40px;color:var(--muted);}
      #offline{display:none;background:#fff0f1;border-bottom:1px solid #fbb;
          padding:6px 16px;font-size:0.8125rem;color:var(--accent);text-align:center;}
      body.offline #offline{display:block;}
      ::-webkit-scrollbar{width:2px;}
      ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
  </style>
</head>
<body>
<div id="offline">&#9889; Offline &#8211; zeige gecachte Daten</div>
<div id="app">
  <div id="hdr">
    <div>
      <h1>Doppelkopf <span>Liste</span></h1>
    </div>
    <button id="sync-btn" onclick="doSync()">&#8635; Sync</button>
  </div>
  <div id="filterbar">
    <span id="filter-status">Teilnahme je Saison</span>
    <button id="participation-filter" class="tog" aria-pressed="false" onclick="toggleFilter()"
      title="Nur Spieler mit mehr als 10 % aller Runden der jeweiligen Saison; Eingabe bleibt vollständig">&gt;10 % Runden</button>
  </div>
  <div id="views">
    <div id="v-saison" class="view active">
      <div id="stabs" class="stabs"></div>
      <div id="sbody"><div class="ld"><div class="sp"></div>Lade&#8230;</div></div>
    </div>
    <div id="v-runden" class="view">
      <div id="stabs2" class="stabs"></div>
      <div id="rbody"><div class="ld"><div class="sp"></div>Lade&#8230;</div></div>
    </div>
    <div id="v-verlauf" class="view">
      <div class="cwrap"><canvas id="chart" height="300"></canvas></div>
      <div class="cleg" id="cleg"></div>
      <p style="font-size:0.75rem;color:var(--muted);margin-top:6px;padding:0 4px">
        Y-Achse: &#216; Punkte/Spiel (niedriger = besser)
      </p>
    </div>
    <div id="v-best" class="view">
      <div id="bbody"><div class="ld"><div class="sp"></div>Lade&#8230;</div></div>
    </div>
    <div id="v-entry" class="view">
      <div id="ebody"></div>
    </div>
  </div>
  <nav id="nav">
    <button class="nb on" onclick="goto('saison',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>SAISON
    </button>
    <button class="nb" id="nav-runden" onclick="goto('runden',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>RUNDEN
    </button>
    <button class="nb" onclick="goto('verlauf',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>VERLAUF
    </button>
    <button class="nb" onclick="goto('best',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg><span>BESTEN<wbr>LISTE</span>
    </button>
    <button class="nb" id="nav-entry" onclick="goto('entry',this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><span>EIN<wbr>TRAGEN</span>
    </button>
  </nav>
</div>
<div id="toast"></div>
<script>
    /* jshint esversion:6 */
    const CFG = window.DOKO_CONFIG || {};
    const BASE = CFG.pocketbaseUrl || "";
    const PIN  = CFG.entryPin || "1234";
    const CUR  = +(CFG.currentSeason || new Date().getFullYear());

    const COL = {
        Lutz:"#b8960c", Anja:"#c0195c", Rolo:"#7b1fa2", Reinhold:"#2e7d32",
        "J\u00f6rg":"#d62f3b", Andy:"#1565c0", Pete:"#00838f", Frank:"#5d4037",
        Armin:"#e65100", Peter:"#455a64", Laurel:"#827717"
    };

    const S = {
        summary:[], history:[], alltime:[],
        players:[], seasons:[], rounds:[], scores:[],
        selYear:null, selYearR:null,
        chartVis:new Set(),
        pinOk:false, editRoundId:null, pendingRoundAction:null, roundBusy:false,
        filterActive:false, participation:Object.create(null)
    };

    // ── API ───────────────────────────────────────────────────────
    async function pbList(coll, params) {
        params = params || {};
        var qs = new URLSearchParams();
        qs.set("perPage", params.perPage || 500);
        if (params.sort)   qs.set("sort",   params.sort);
        if (params.filter) qs.set("filter", params.filter);
        var items = [], page = 1;
        while (true) {
            qs.set("page", page);
            var r = await fetch(BASE + "/api/collections/" + coll + "/records?" + qs.toString());
            if (!r.ok) throw new Error(await r.text());
            var data = await r.json();
            items = items.concat(data.items);
            if (page >= data.totalPages) break;
            page++;
        }
        return items;
    }

    async function pbCreate(coll, body) {
        return pbWrite("POST", coll, null, body);
    }

    async function pbWrite(method, coll, id, body) {
        var r = await fetch(BASE + "/api/collections/" + coll + "/records" + (id ? "/" + id : ""), {
            method: method,
            headers: {"Content-Type": "application/json"},
            body: body === undefined ? undefined : JSON.stringify(body)
        });
        if (!r.ok) {
            var message = await r.text();
            try { message = JSON.parse(message).message || message; } catch (_) {}
            var error = new Error(message);
            error.status = r.status;
            throw error;
        }
        return r.status === 204 ? null : r.json();
    }

    // PocketBase-Batch ist auf dieser Instanz deaktiviert: Teilschritte kompensieren.
    async function applyRoundChanges(operations) {
        var undo = [];
        try {
            for (var op of operations) {
                var result = await pbWrite(op.method, op.coll, op.id, typeof op.body === "function" ? op.body() : op.body);
                if (op.undo) undo.push(op.undo(result));
            }
        } catch (error) {
            var uncertain = !error.status;
            for (var i = undo.length - 1; i >= 0; i--) {
                var inverse = undo[i];
                try { await pbWrite(inverse.method, inverse.coll, inverse.id, inverse.body); }
                catch (_) { uncertain = true; }
            }
            throw new Error(error.message + (uncertain
                ? " Zustand unklar. Bitte synchronisieren und Daten prüfen."
                : " Änderungen wurden zurückgesetzt."));
        }
    }

    function buildViews() {
        var playerById = {}; S.players.forEach(function(p){ playerById[p.id] = p; });
        var seasonById = {}; S.seasons.forEach(function(s){ seasonById[s.id] = s; });
        var roundById  = {}; S.rounds.forEach(function(r){ roundById[r.id]  = r; });

        var agg = {};
        S.scores.forEach(function(sc) {
            var round  = roundById[sc.round];   if (!round)  return;
            var season = seasonById[round.season]; if (!season) return;
            var player = playerById[sc.player]; if (!player) return;
            var key = season.year + "|" + player.id;
            var a = agg[key];
            if (!a) a = agg[key] = {
                year: +season.year, season_label: season.label || "",
                player_id: player.id, player: player.name, color_hex: player.color_hex,
                rounds: new Set(), total_games: 0, total_points: 0
            };
            a.rounds.add(round.id);
            a.total_games  += +sc.games_played;
            a.total_points += +sc.points;
        });
        var summary = Object.keys(agg).map(function(k) {
            var a = agg[k];
            return {
                year: a.year, season_label: a.season_label,
                player_id: a.player_id, player: a.player, color_hex: a.color_hex,
                rounds_played: a.rounds.size,
                total_games:   a.total_games,
                total_points:  a.total_points,
                avg_points_per_game: a.total_games ? a.total_points / a.total_games : 0,
                season_rank: 0
            };
        });
        S.participation = Object.create(null);
        S.rounds.forEach(function(round){
            var season = seasonById[round.season];
            if (!season) return;
            var stats = S.participation[season.year];
            if (!stats) stats = S.participation[season.year] = {totalRounds: 0, players: Object.create(null)};
            stats.totalRounds++;
        });
        summary.forEach(function(row){ S.participation[row.year].players[row.player] = row.rounds_played; });
        summary = summary.filter(function(row){ return qualifiesForYear(row.player, row.year); });
        var byYear = {};
        summary.forEach(function(r){ (byYear[r.year] = byYear[r.year] || []).push(r); });
        Object.keys(byYear).forEach(function(y) {
            byYear[y].sort(function(a,b){ return a.avg_points_per_game - b.avg_points_per_game; });
            byYear[y].forEach(function(r, i){ r.season_rank = i + 1; });
        });
        S.summary = summary;

        S.history = summary.map(function(r) {
            return {
                player: r.player, color_hex: r.color_hex, year: r.year,
                season_rank: r.season_rank,
                avg_points_per_game: r.avg_points_per_game,
                total_games: r.total_games
            };
        });

        var winsBy = {};
        summary.filter(function(r){ return r.season_rank === 1; })
               .forEach(function(r){ winsBy[r.player_id] = (winsBy[r.player_id] || 0) + 1; });

        var atAgg = {};
        S.scores.forEach(function(sc) {
            var round  = roundById[sc.round];   if (!round)  return;
            var season = seasonById[round.season]; if (!season) return;
            var player = playerById[sc.player]; if (!player) return;
            if (!qualifiesForYear(player.name, season.year)) return;
            var a = atAgg[player.id];
            if (!a) a = atAgg[player.id] = {
                player_id: player.id, player: player.name, color_hex: player.color_hex,
                active: player.active, seasons: new Set(),
                total_games: 0, total_points: 0
            };
            a.seasons.add(+season.year);
            a.total_games  += +sc.games_played;
            a.total_points += +sc.points;
        });
        S.alltime = Object.keys(atAgg).map(function(k) {
            var a = atAgg[k];
            return {
                player_id: a.player_id, player: a.player, color_hex: a.color_hex,
                active: a.active,
                seasons_played:    a.seasons.size,
                total_games_ever:  a.total_games,
                total_points_ever: a.total_points,
                alltime_avg: a.total_games ? a.total_points / a.total_games : 0,
                season_wins: winsBy[a.player_id] || 0
            };
        }).sort(function(a,b){ return a.alltime_avg - b.alltime_avg; });
    }

    async function doSync() {
        const b = document.getElementById("sync-btn");
        b.classList.add("syncing"); b.textContent = "\u21bb \u2026";
        try {
            const res = await Promise.all([
                pbList("players",      {sort: "name"}),
                pbList("seasons",      {sort: "-year"}),
                pbList("rounds",       {sort: "round_number"}),
                pbList("round_scores")
            ]);
            S.players = res[0]; S.seasons = res[1];
            S.rounds  = res[2]; S.scores  = res[3];
            buildViews();
            if (!S.chartVis.size) {
                S.players.forEach(function(p){ S.chartVis.add(p.name); });
            }
            if (S.seasons.length && S.selYear === null) {
                var newest = +S.seasons[0].year;
                S.selYear = newest; S.selYearR = newest;
            }
            render(); toast("Aktualisiert", "ok");
            return true;
        } catch(e) { toast(e.message, "err"); return false; }
        finally { b.classList.remove("syncing"); b.textContent = "\u21bb Sync"; }
    }

    // ── Routing ───────────────────────────────────────────────────
    var active = "saison";
    function goto(v, btn) {
        if (v !== "entry") S.pendingRoundAction = null;
        document.querySelectorAll(".view").forEach(function(el){ el.classList.remove("active"); });
        document.querySelectorAll(".nb").forEach(function(el){ el.classList.remove("on"); });
        document.getElementById("v-" + v).classList.add("active");
        if (btn) btn.classList.add("on");
        active = v; render();
    }
    function render() {
        renderFilterControl();
        if (active === "saison")  renderSaison();
        if (active === "runden")  renderRunden();
        if (active === "verlauf") renderVerlauf();
        if (active === "best")    renderBest();
        if (active === "entry")   renderEntry();
    }

    // ── SAISON ────────────────────────────────────────────────────
    function renderSaison() {
        var years = S.seasons.map(function(s){ return +s.year; }).sort(function(a,b){ return b-a; });
        if (years.length && (!S.selYear || !years.includes(+S.selYear))) S.selYear = years[0];

        document.getElementById("stabs").innerHTML = years.map(function(y) {
            var on = +y === +S.selYear ? " on" : "";
            return '<button class="stab' + on + '" onclick="selY(' + y + ',\'saison\')">' + y + '</button>';
        }).join("");

        var rows = S.summary.filter(function(r){ return +r.year === +S.selYear; })
            .filter(function(r){ return qualifiesForYear(r.player, S.selYear); })
            .sort(function(a,b){ return a.season_rank - b.season_rank; });
        var el = document.getElementById("sbody");
        if (!rows.length) { el.innerHTML = '<div class="ld">Keine Daten</div>'; return; }

        var hi = Math.max.apply(null, rows.map(function(r){ return +r.avg_points_per_game; }));
        var lo = Math.min.apply(null, rows.map(function(r){ return +r.avg_points_per_game; }));

        el.innerHTML = '<div class="card"><div class="ct">Rangliste ' + S.selYear +
            (+S.selYear === CUR ? " \u26a1" : "") + '</div>' +
            rows.map(function(r, i) {
                var a = +r.avg_points_per_game, c = COL[r.player] || "#888";
                var bw = hi > lo ? Math.round((1-(a-lo)/(hi-lo))*100) : 80;
                var rank = i + 1;
                var medals = {1:"&#127945;", 2:"&#127946;", 3:"&#127947;"};
                var left = medals[rank]
                    ? '<div style="font-size:1.25rem;min-width:22px;text-align:center">' + medals[rank] + '</div>'
                    : '<div class="rnum">' + rank + '</div>';
                return '<div class="rrow">' + left +

                    '<div style="display:flex;justify-content:space-between">' +
                    '<span class="rname" style="color:' + c + '">' + r.player + '</span>' +
                    '<span class="ravg" style="color:' + c + '">' + a.toFixed(4) + '</span>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:6px">' +
                    '<div class="rbar" style="flex:1"><div class="rbfill" style="width:' + bw + '%;background:' + c + '"></div></div>' +
                    '<span class="rgms">' + r.total_games + ' Sp.</span>' +
                    '</div>' +
                    '</div></div>';
            }).join("") + '</div>';

    function selY(y, which) {
        if (which === "saison") { S.selYear = +y; renderSaison(); }
        else { S.selYearR = +y; renderRunden(); }
    }

    function qualifiesForYear(playerName, year) {
        if (!S.filterActive) return true;
        var stats = S.participation[+year];
        return !!stats && stats.totalRounds > 0 && (stats.players[playerName] || 0) * 10 > stats.totalRounds;
    }

        var bar = document.getElementById("filterbar");
        if (bar) bar.hidden = active === "entry";
        var button = document.getElementById("participation-filter");
        if (button) {
            button.classList.toggle("on", S.filterActive);
            button.setAttribute("aria-pressed", String(S.filterActive));
            button.disabled = S.roundBusy;
        }
    }

    function toggleFilter() {
        if (S.roundBusy) return;
        S.filterActive = !S.filterActive;
        buildViews();
        // Das Formular nicht ersetzen: ungespeicherte Werte bleiben erhalten.
        if (active === "entry") renderFilterControl();
        else render();
    }

        if (years.length && (!S.selYearR || !years.includes(+S.selYearR))) S.selYearR = years[0];

        document.getElementById("stabs2").innerHTML = years.map(function(y) {
            var on = +y === +S.selYearR ? " on" : "";

                '<div style="font-size:0.8125rem;color:var(--muted)">' + dt + '</div>' +

                        '<span style="font-size:1.125rem;min-width:20px">' + (medals[i] || "") + '</span>' +

                        '<span style="color:' + c + ';font-size:0.8125rem;min-width:44px;text-align:right">' +
                        (s.avg != null ? "\u00d8" + s.avg.toFixed(2) : "?") + '</span>' +
                        '</div>';
                }).join("") : '<p style="color:var(--muted);font-size:0.875rem">' +
                    (S.filterActive ? 'Keine Ergebnisse für diesen Filter' : 'Keine Ergebnisse') + '</p>') +
                '<div class="round-actions">' +
                '<button class="btn btn-s" onclick="editRound(\'' + r.id + '\')"' + (S.roundBusy ? ' disabled' : '') + '>Bearbeiten</button>' +
                '<button class="btn btn-s btn-danger" onclick="deleteRound(\'' + r.id + '\')"' + (S.roundBusy ? ' disabled' : '') + '>Löschen</button>' +
                '</div></div>';

    function drawChart(years, players) {
        var cv = document.getElementById("chart");
        var w = cv.parentElement.clientWidth - 12, h = 300;
        cv.width = w; cv.height = h;
        var ctx = cv.getContext("2d");
        var P = {t:12, r:36, b:32, l:44};
        var dm = {};
        S.history.forEach(function(r){
            var v = r.avg_points_per_game;
            (dm[r.player] = dm[r.player] || {})[+r.year] = v == null || v === "" ? NaN : +v;
        });
        var values = [];
        var series = players.filter(function(p){ return S.chartVis.has(p); }).map(function(p){
            return {player: p, values: years.map(function(yr){
                var v = dm[p] && dm[p][yr];
                if (!Number.isFinite(v) || !qualifiesForYear(p, yr)) return null;
                values.push(v);
                return v;
            })};
        });

        // Skala aus denselben Werten ableiten, die anschließend gezeichnet werden.
        var low = values.length ? Math.min.apply(null, values) : 0;
        var high = values.length ? Math.max.apply(null, values) : 1;
        var padding = Math.max((high - low) * 0.1, 0.1);
        var rawStep = (high - low + 2 * padding) / 5;
        var magnitude = Math.pow(10, Math.floor(Math.log10(rawStep)));
        var factor = rawStep / magnitude;
        var step = (factor <= 1 ? 1 : factor <= 2 ? 2 : factor <= 5 ? 5 : 10) * magnitude;
        var N = Math.floor((low - padding) / step) * step;
        var X = Math.ceil((high + padding) / step) * step;
        var decimals = Math.max(1, -Math.floor(Math.log10(step)));
        var ticks = [];
        for (var i = 0; i <= Math.round((X - N) / step); i++) {
            ticks.push(Number((N + i * step).toFixed(decimals)));
        }
        ctx.font = "13px 'Courier New'";
        ticks.forEach(function(v){
            P.l = Math.max(P.l, Math.ceil(ctx.measureText(v.toFixed(decimals)).width) + 10);
        });
        var xp = function(i){ return P.l + (i / (years.length - 1 || 1)) * (w - P.l - P.r); };
        var yp = function(v){ return P.t + (v - N) / (X - N) * (h - P.t - P.b); };
        ctx.clearRect(0, 0, w, h);
        ticks.forEach(function(v) {
            var y = yp(v);
            ctx.beginPath(); ctx.moveTo(P.l, y); ctx.lineTo(w - P.r, y);
            ctx.strokeStyle = v === 2 ? "#c8d0da" : "#eef1f5";
            ctx.setLineDash(v === 2 ? [4,4] : []);
            ctx.lineWidth = 1; ctx.stroke(); ctx.setLineDash([]);
            ctx.fillStyle = "#7a8fa6"; ctx.font = "13px 'Courier New'";
            ctx.textAlign = "right"; ctx.fillText(v.toFixed(decimals), P.l - 3, y + 4);
        });
        ctx.fillStyle = "#7a8fa6"; ctx.font = "13px 'Courier New'"; ctx.textAlign = "center";
        years.forEach(function(yr, i) {
            ctx.fillText(String(yr).slice(2), xp(i), h - P.b + 14);
        });
        series.forEach(function(s) {
            var c = COL[s.player] || "#888";
            ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.lineJoin = "round";
            ctx.beginPath(); var f = true;
            s.values.forEach(function(v, i) {
                if (v === null) return;
                if (f) { ctx.moveTo(xp(i), yp(v)); f = false; } else { ctx.lineTo(xp(i), yp(v)); }
            });
            ctx.stroke();
            s.values.forEach(function(v, i) {
                if (v === null) return;
                ctx.beginPath(); ctx.arc(xp(i), yp(v), 3, 0, Math.PI * 2);
                ctx.fillStyle = c; ctx.fill();
            });
        });
    }
    window.addEventListener("resize", function() {
        if (active === "verlauf") {
            var y = [...new Set(S.history.map(function(r){ return +r.year; }))].sort(function(a,b){ return a-b; });
            drawChart(y, [...new Set(S.history.map(function(r){ return r.player; }))]);
        }
    });

    // ── BESTENLISTE ───────────────────────────────────────────────
    function renderBest() {
        var el = document.getElementById("bbody");
        if (!S.alltime.length) {
            el.innerHTML = '<div class="ld">' + (S.filterActive ? 'Keine Daten für diesen Filter' : 'Keine Daten') + '</div>';
            return;
        }
        var byYear = {};
        S.summary.forEach(function(r){ (byYear[+r.year] = byYear[+r.year] || []).push(r); });
        var winners = {};
        Object.entries(byYear).forEach(function(kv) {
            var yr = kv[0], rows = kv[1];
            var candidates = rows.filter(function(r){ return qualifiesForYear(r.player, +yr); });
            if (!candidates.length) return;
            var w = candidates.reduce(function(b,r){ return +r.avg_points_per_game < +b.avg_points_per_game ? r : b; });
            winners[yr] = w.player;
        });
        var wc = {};
        Object.values(winners).forEach(function(p){ wc[p] = (wc[p] || 0) + 1; });

        var atRows = S.alltime.filter(function(r){ return r.seasons_played >= 3; })
            .map(function(r){ return {name:r.player, avg:+r.alltime_avg, seasons:r.seasons_played, active:r.active}; });

        el.innerHTML =
            '<div class="card"><div class="ct">Gesamtrangliste</div>' +
            '<div class="cs">\u00d8 Punkte/Spiel \u00fcber alle Saisonen (mind. 3)</div>' +
            atRows.map(function(r, i) {
                var a = r.avg, c = COL[r.name] || "#888", ww = wc[r.name] || 0;
                var bw = Math.max(0, (1 - (a - 1.4) / (3.0 - 1.4)) * 100);
                var trophies = ww ? " " + "\u{1F3C6}".repeat(ww) : "";
                return '<div class="rrow"><div class="rnum">#' + (i+1) + '</div>' +
                    '<div style="flex:1;min-width:0">' +
                    '<div style="display:flex;justify-content:space-between">' +
                    '<span class="rname" style="color:' + c + '">' + r.name + (!r.active ? " \u2020" : "") + trophies + '</span>' +
                    '<span class="ravg" style="color:' + c + '">' + a.toFixed(4) + '</span>' +
                    '</div>' +
                    '<div style="display:flex;align-items:center;gap:6px">' +
                    '<div class="rbar" style="flex:1"><div class="rbfill" style="width:' + bw + '%;background:' + c + '"></div></div>' +
                    '<span class="rgms">' + r.seasons + ' Sais.</span>' +
                    '</div>' +
                    '</div></div>';
            }).join("") + '</div>' +
            (function() {
                var pm = {};
                S.summary.forEach(function(r){
                    if (!qualifiesForYear(r.player, +r.year)) return;
                    if (!pm[r.player]) pm[r.player] = { ranks:[], seasons:0, active: true };
                    pm[r.player].ranks.push(+r.season_rank);
                    pm[r.player].seasons++;
                });
                var at = S.alltime.reduce(function(m,r){ m[r.player] = r; return m; }, {});
                var stats = Object.keys(pm).filter(function(n){ return pm[n].seasons >= 3; }).map(function(name) {
                    var ranks = pm[name].ranks;
                    var sum = ranks.reduce(function(a,b){ return a+b; }, 0);
                    var avg = sum / ranks.length;
                    var active = at[name] ? at[name].active : true;
                    return { name:name, avg:avg, seasons:pm[name].seasons, active:active };
                }).sort(function(a,b){ return a.avg - b.avg; });
                var hi = stats.length ? stats[stats.length-1].avg : 1;
                var lo = stats.length ? stats[0].avg : 1;
                return '<div class="card"><div class="ct">Gesamtrangliste</div>' +
                    '<div class="cs">Ø Platzierung über alle Saisonen (mind. 3)</div>' +
                    stats.map(function(r, i) {
                        var c = COL[r.name] || "#888";
                        var bw = hi > lo ? Math.round((1 - (r.avg - lo) / (hi - lo)) * 100) : 80;
                        return '<div class="rrow"><div class="rnum">#' + (i+1) + '</div>' +
                            '<div style="flex:1;min-width:0">' +
                            '<div style="display:flex;justify-content:space-between">' +
                            '<span class="rname" style="color:' + c + '">' + r.name + (!r.active ? " †" : "") + '</span>' +
                            '<span class="ravg" style="color:' + c + '">' + r.avg.toFixed(2) + '</span>' +
                            '</div>' +
                            '<div style="display:flex;align-items:center;gap:6px">' +
                            '<div class="rbar" style="flex:1"><div class="rbfill" style="width:' + bw + '%;background:' + c + '"></div></div>' +
                            '<span class="rgms">' + r.seasons + ' Sais.</span>' +
                            '</div>' +
                            '</div></div>';
                    }).join("") + '</div>';
            })() +
            '<div class="card"><div class="ct">Jahressieger</div>' +
            Object.entries(winners).sort(function(a,b){ return b[0]-a[0]; }).map(function(kv) {
                var yr = kv[0], p = kv[1], c = COL[p] || "#888";
                var row = S.summary.find(function(r){ return +r.year === +yr && r.player === p; });
                return '<div class="row">' +
                    '<span style="color:var(--muted);font-size:0.8125rem;min-width:44px">' + yr + '</span>' +
                    '<span style="color:' + c + ';font-weight:600;font-size:1rem;flex:1">' + p + '</span>' +

                    '</div>';
            }).join("") + '</div>' +
            (function() {
                var allYears = [...new Set(S.summary.map(function(r){ return +r.year; }))].sort(function(a,b){ return a-b; });
                var pm = {};
                S.summary.forEach(function(r){
                    if (!qualifiesForYear(r.player, +r.year)) return;
                    if (!pm[r.player]) pm[r.player] = {};
                    pm[r.player][+r.year] = +r.season_rank;
                });
                var stats = Object.keys(pm).map(function(name) {
                    var ranks = Object.values(pm[name]);
                    var sum = ranks.reduce(function(a,b){ return a+b; }, 0);
                    return { name:name, ranks:pm[name], sum:sum, avg:sum/ranks.length };
                }).sort(function(a,b){ return a.avg - b.avg; });
                var rankBg = ["","#ffd70028","#c0c0c028","#cd7f3228"];
                var thead = '<tr style="border-bottom:2px solid var(--border)">' +
                    '<th style="text-align:left;padding:5px 8px 5px 0;white-space:nowrap">Spieler</th>' +
                    allYears.map(function(y){ return '<th style="padding:5px 4px;min-width:28px">' + y + '</th>'; }).join("") +
                    '<th style="padding:5px 4px;min-width:28px">&#931;</th>' +
                    '<th style="padding:5px 4px;min-width:36px">&#216;</th></tr>';
                var tbody = stats.map(function(ps) {
                    var c = COL[ps.name] || "#888";
                    return '<tr style="border-bottom:1px solid var(--border)">' +
                        '<td style="padding:5px 10px 5px 0;color:' + c + ';font-weight:600;white-space:nowrap">' + ps.name + '</td>' +
                        allYears.map(function(y) {
                            var r = ps.ranks[y];
                            if (!r) return '<td style="padding:5px 4px;text-align:center;color:var(--muted)">–</td>';
                            var bg = rankBg[r] || "";
                            return '<td style="padding:5px 4px;text-align:center;' + (bg ? 'background:' + bg + ';' : '') + '">' + r + '</td>';
                        }).join("") +
                        '<td style="padding:5px 4px;text-align:center;color:var(--muted)">' + ps.sum + '</td>' +
                        '<td style="padding:5px 4px;text-align:center;font-weight:600">' + ps.avg.toFixed(2) + '</td>' +
                        '</tr>';
                }).join("");
                return '<div class="card" style="padding:14px 14px 8px;overflow-x:auto">' +
                    '<div class="ct" style="margin-bottom:8px">Platzierungen</div>' +
                    '<table style="width:100%;border-collapse:collapse;font-size:0.8125rem">' +
                    '<thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table></div>';
            })();

    // ── EINTRAGEN ─────────────────────────────────────────────────
    function setRoundBusy(busy) {
        S.roundBusy = busy;
        document.querySelectorAll('#v-entry input, #v-entry select, #v-entry button, #rbody .round-actions button, #sync-btn, #participation-filter')
            .forEach(function(el){ el.disabled = busy; });
    }

    function unlockRoundAction(action, id) {
        if (S.pinOk) return true;
        S.pendingRoundAction = {action: action, id: id};
        goto("entry", document.getElementById("nav-entry"));
        return false;
    }

    function editRound(id) {
        if (S.roundBusy || !unlockRoundAction("edit", id)) return;
        var round = S.rounds.find(function(r){ return r.id === id; });
        if (!round) { toast("Runde nicht gefunden", "err"); return; }
        S.editRoundId = id;
        goto("entry", document.getElementById("nav-entry"));
    }

    function cancelEditRound() {
        if (S.roundBusy) return;
        S.editRoundId = null;
        goto("runden", document.getElementById("nav-runden"));
    }

    function lockEntry() {
        if (S.roundBusy) return;
        S.pinOk = false;
        S.editRoundId = null;
        S.pendingRoundAction = null;
        renderEntry();
    }

    function roundPlayers() {
        return S.players.filter(function(p){
            return p.active || (S.editRoundId && S.scores.some(function(s){
                return s.round === S.editRoundId && s.player === p.id;
            }));
        });
    }

    function scoreBody(score) {
        return {round: score.round, player: score.player, points: +score.points, games_played: +score.games_played};
    }

    function removeScoreOperation(score) {
        return {method: "DELETE", coll: "round_scores", id: score.id,
            undo: function(){ return {method: "POST", coll: "round_scores",
                body: Object.assign({id: score.id}, scoreBody(score))}; }};
    }

    function roundEditOperations(round, body, scores) {
        var operations = [{method: "PATCH", coll: "rounds", id: round.id, body: body,
            undo: function(){ return {method: "PATCH", coll: "rounds", id: round.id,
                body: {season: round.season, round_number: round.round_number, played_on: round.played_on || ""}}; }}];
        var previous = S.scores.filter(function(s){ return s.round === round.id; });
        scores.forEach(function(score){
            var old = previous.find(function(s){ return s.player === score.player; });
            if (old) {
                if (+old.points === score.points && +old.games_played === score.games_played) return;
                operations.push({method: "PATCH", coll: "round_scores", id: old.id,
                    body: {points: score.points, games_played: score.games_played},
                    undo: function(){ return {method: "PATCH", coll: "round_scores", id: old.id,
                        body: {points: +old.points, games_played: +old.games_played}}; }});
            } else {
                operations.push({method: "POST", coll: "round_scores",
                    body: Object.assign({round: round.id}, score),
                    undo: function(created){ return {method: "DELETE", coll: "round_scores", id: created.id}; }});
            }
        });
        previous.forEach(function(score){
            if (!scores.some(function(s){ return s.player === score.player; })) operations.push(removeScoreOperation(score));
        });
        return operations;
    }

    async function deleteRound(id) {
        if (S.roundBusy || !unlockRoundAction("delete", id)) return;
        var round = S.rounds.find(function(r){ return r.id === id; });
        if (!round) { toast("Runde nicht gefunden", "err"); return; }
        var season = S.seasons.find(function(s){ return s.id === round.season; });
        S.selYearR = season ? +season.year : S.selYearR;
        goto("runden", document.getElementById("nav-runden"));
        if (!confirm("Runde " + round.round_number + " (Saison " + (season ? season.year : "?") +
            (round.played_on ? ", " + String(round.played_on).slice(0, 10) : "") +
            ") mit allen Ergebnissen endgültig löschen?")) return;
        if (!navigator.onLine) { toast("Zum Löschen ist eine Verbindung nötig", "err"); return; }
        var operations = S.scores.filter(function(s){ return s.round === id; }).map(removeScoreOperation);
        operations.push({method: "DELETE", coll: "rounds", id: id});
        setRoundBusy(true);
        try {
            await applyRoundChanges(operations);
            if (S.editRoundId === id) S.editRoundId = null;
            var synced = await doSync();
            toast("Runde " + round.round_number + " gelöscht" + (synced === false ? ". Bitte erneut synchronisieren." : ""), synced === false ? "err" : "ok");
        } catch (error) { toast("Löschen fehlgeschlagen: " + error.message, "err"); }
        finally { setRoundBusy(false); }
    }

    function renderEntry() {
        if (!S.pinOk) { renderPin(); return; }
        renderEntryForm();
    }

    function renderPin() {
        document.getElementById("ebody").innerHTML =
            '<div class="pin-wrap"><form class="pin-box" autocomplete="off" onsubmit="event.preventDefault();chkPin({key:\'Enter\'})">' +
            '<h2>&#128274; Eintragen</h2>' +
            '<p style="color:var(--muted);font-size:0.875rem;margin-bottom:14px">PIN eingeben:</p>' +
            '<input type="password" inputmode="numeric" id="pinf" name="pin" class="pini" maxlength="6" autocomplete="off" placeholder="\u2022\u2022\u2022\u2022">' +
            '<div class="perr" id="perr"></div>' +
            '<button type="submit" class="btn btn-p">Entsperren</button>' +
            '</form></div>';
    }
    function chkPin(e) {
        if (e.key !== "Enter") return;
        var v = (document.getElementById("pinf") || {}).value || "";
        if (v === PIN) {
            S.pinOk = true;
            var pending = S.pendingRoundAction;
            S.pendingRoundAction = null;
            if (pending && pending.action === "edit") editRound(pending.id);
            else if (pending && pending.action === "delete") deleteRound(pending.id);
            else renderEntry();
        }
        else document.getElementById("perr").textContent = "Falscher PIN";
    }

    function estNextRound(seasonId) {
        var rs = S.rounds.filter(function(r){ return r.season === seasonId; });
        if (!rs.length) return 1;
        return Math.max.apply(null, rs.map(function(r){ return +r.round_number || 0; })) + 1;
    }
    function onSeasonChange() {
        var sel = document.getElementById("rseason");
        var rnr = document.getElementById("rnr");
        if (sel && rnr && !S.editRoundId) rnr.value = estNextRound(sel.value);
    }

    function renderEntryForm() {
        if (!S.seasons.length) {
            document.getElementById("ebody").innerHTML =
                '<div class="card"><p style="color:var(--muted);font-size:1rem">Keine Saisonen gefunden.</p></div>';
            return;
        }
        var editing = S.rounds.find(function(r){ return r.id === S.editRoundId; });
        if (S.editRoundId && !editing) { S.editRoundId = null; toast("Runde nicht mehr vorhanden", "err"); }
        var activePlayers = roundPlayers();
        var existingScores = editing ? S.scores.filter(function(s){ return s.round === editing.id; }) : [];
        var defSeason = (editing && S.seasons.find(function(s){ return s.id === editing.season; }))
            || S.seasons.find(function(s){ return +s.year === +S.selYearR; })
            || S.seasons.find(function(s){ return +s.year === CUR; })
            || S.seasons[0];
        var defNr   = editing ? +editing.round_number : estNextRound(defSeason.id);
        var today   = editing ? String(editing.played_on || "").slice(0, 10) : new Date().toISOString().slice(0, 10);

        var seasonOpts = S.seasons.map(function(s) {
            var sel = s.id === defSeason.id ? " selected" : "";
            var lbl = s.label || s.year;
            return '<option value="' + s.id + '"' + sel + '>' + s.year + ' \u2013 ' + lbl + '</option>';
        }).join("");

        var playerRows = activePlayers.map(function(p) {
            var c = COL[p.name] || "#888";
            var score = existingScores.find(function(s){ return s.player === p.id; });
            return '<div class="per" id="pe-' + p.id + '">' +
                '<div class="per-hdr">' +
                '<div class="dot" style="background:' + c + '"></div>' +
                '<span class="pname">' + p.name + (p.active ? '' : ' (inaktiv)') + '</span>' +
                '<button class="tog' + (score ? ' on' : '') + '" id="tog-' + p.id + '" onclick="togPlayer(\'' + p.id + '\')">' + (score ? '\u2713 Dabei' : 'Dabei?') + '</button>' +
                '</div>' +
                '<div class="pflds' + (score ? '' : ' hide') + '" id="pf-' + p.id + '">' +
                '<div><div class="pfl">PUNKTE</div>' +
                '<input type="number" inputmode="decimal" class="pfi" id="pts-' + p.id + '" value="' + (score ? +score.points : '') + '" placeholder="0" step="any">' +
                '</div>' +
                '<div><div class="pfl">SPIELE</div>' +
                '<input type="number" inputmode="numeric" class="pfi" id="gms-' + p.id + '" value="' + (score ? +score.games_played : '') + '" placeholder="0" min="1" step="1">' +
                '</div>' +
                '</div>' +
                '</div>';
        }).join("");

        document.getElementById("ebody").innerHTML =
            '<div class="card"><div class="ct">' + (editing ? 'Runde ' + editing.round_number + ' bearbeiten' : 'Neue Runde eintragen') + '</div>' +
            '<div style="margin-bottom:12px"><label class="fl">Saison</label>' +
            '<select id="rseason" class="fsel" onchange="onSeasonChange()">' + seasonOpts + '</select></div>' +
            '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px">' +
            '<div><label class="fl">Runden-Nr.</label>' +
            '<input type="number" id="rnr" class="fi" value="' + defNr + '" min="1"></div>' +
            '<div><label class="fl">Datum</label>' +
            '<input type="date" id="rdate" class="fi" value="' + today + '"></div>' +
            '</div></div>' +
            '<div class="card"><div class="ct">Ergebnisse pro Spieler</div>' +
            '<div class="cs">Spieler antippen zum Aktivieren, dann Punkte und Spiele eintragen</div>' +
            '<div id="player-entries">' + playerRows + '</div></div>' +
            '<button class="btn btn-p" onclick="submitRound()">' + (editing ? 'Änderungen speichern' : 'Runde speichern') + '</button>' +
            (editing ? '<button class="btn btn-s" onclick="cancelEditRound()">Abbrechen</button>' : '') +
            '<div class="card" style="margin-top:14px"><div class="ct">Neue Saison anlegen</div>' +
            '<div style="margin-bottom:10px"><label class="fl">Startjahr</label>' +
            '<input type="number" id="ns-year" class="fi" value="' + new Date().getFullYear() + '" min="2000" max="2099"></div>' +
            '<div style="margin-bottom:12px"><label class="fl">Bezeichnung (optional)</label>' +
            '<input type="text" id="ns-label" class="fi" placeholder="z.B. ab 01.03.2026"></div>' +
            '<button class="btn btn-s" onclick="createSeason()">+ Saison anlegen</button></div>' +
            '<button class="btn btn-s" onclick="lockEntry()" style="margin-top:4px">&#128274; Sperren</button>';
        if (S.roundBusy) setRoundBusy(true);
    }

    function togPlayer(id) {
        if (S.roundBusy) return;
        var tog  = document.getElementById("tog-" + id);
        var flds = document.getElementById("pf-" + id);
        var on   = !tog.classList.contains("on");
        tog.classList.toggle("on", on);
        tog.textContent = on ? "\u2713 Dabei" : "Dabei?";
        flds.classList.toggle("hide", !on);
        if (on) { var f = document.getElementById("pts-" + id); if (f) f.focus(); }
    }

    async function createSeason() {
        if (S.roundBusy) return;
        var yearEl = document.getElementById("ns-year");
        var lblEl  = document.getElementById("ns-label");
        var year   = parseInt(yearEl ? yearEl.value : "");
        var label  = lblEl ? lblEl.value.trim() : "";
        if (!year || year < 2000) { toast("Ungültiges Jahr", "err"); return; }
        if (S.seasons.find(function(s){ return +s.year === year; })) {
            toast("Saison " + year + " existiert bereits", "err"); return;
        }
        try {
            await pbCreate("seasons", {year: year, label: label || ""});
            toast("Saison " + year + " angelegt", "ok");
            await doSync();
            renderEntryForm();
        } catch(e) { toast(e.message, "err"); }
    }

    function toPbDate(d) {
        return d ? (d + " 00:00:00.000Z") : "";
    }

    async function submitRound() {
        if (S.roundBusy) return;
        if (!S.pinOk) { renderPin(); return; }
        if (!navigator.onLine) { toast("Zum Speichern ist eine Verbindung nötig", "err"); return; }
        var editing = S.rounds.find(function(r){ return r.id === S.editRoundId; });
        if (S.editRoundId && !editing) { toast("Runde nicht mehr vorhanden", "err"); return; }
        var nrEl = document.getElementById("rnr");
        var dtEl = document.getElementById("rdate");
        var rsEl = document.getElementById("rseason");
        var nr   = Number(nrEl ? nrEl.value : "");
        var dt   = dtEl ? dtEl.value : "";
        if (!Number.isInteger(nr) || nr < 1) { toast("Runden-Nr. muss eine positive ganze Zahl sein", "err"); return; }

        var selSid = rsEl ? rsEl.value : "";
        var season = S.seasons.find(function(s){ return s.id === selSid; });
        if (!season) { toast("Saison nicht gefunden", "err"); return; }
        if (S.rounds.some(function(r){ return r.season === selSid && +r.round_number === nr && r.id !== S.editRoundId; })) {
            toast("Runde " + nr + " existiert in dieser Saison bereits", "err"); return;
        }

        var scores = [];
        var invalidPlayer = null;
        roundPlayers().forEach(function(p) {
            var tog = document.getElementById("tog-" + p.id);
            if (!tog || !tog.classList.contains("on")) return;
            var ptsEl = document.getElementById("pts-" + p.id);
            var gmsEl = document.getElementById("gms-" + p.id);
            var pts = Number(ptsEl ? ptsEl.value : "");
            var gms = Number(gmsEl ? gmsEl.value : "");
            if (!ptsEl || !ptsEl.value.trim() || !Number.isFinite(pts) || !Number.isInteger(gms) || gms <= 0) {
                invalidPlayer = p.name; return;
            }
            scores.push({player: p.id, points: pts, games_played: gms});
        });

        if (invalidPlayer !== null) { toast("Bitte gültige Punkte und eine positive ganze Spielezahl für " + invalidPlayer + " eingeben", "err"); return; }
        if (!scores.length) { toast("Mindestens 1 Spieler mit Werten", "err"); return; }
        if (editing && S.scores.some(function(s){
            return s.round === editing.id && !S.players.some(function(p){ return p.id === s.player; });
        })) { toast("Ein bisheriger Teilnehmer fehlt. Bitte synchronisieren und Daten prüfen.", "err"); return; }

        var totalGames = scores.reduce(function(sum, s){ return sum + s.games_played; }, 0);
        if (totalGames % 4 !== 0) { toast("Spiele-Summe (" + totalGames + ") nicht durch 4 teilbar", "err"); return; }

        var body = {season: season.id, round_number: nr, played_on: toPbDate(dt)};
        var operations;
        if (editing) operations = roundEditOperations(editing, body, scores);
        else {
            var createdRound;
            operations = [{method: "POST", coll: "rounds", body: body,
                undo: function(created){
                    createdRound = created;
                    return {method: "DELETE", coll: "rounds", id: created.id};
                }}];
            scores.forEach(function(score){
                operations.push({method: "POST", coll: "round_scores",
                    body: function(){ return Object.assign({round: createdRound.id}, score); },
                    undo: function(created){ return {method: "DELETE", coll: "round_scores", id: created.id}; }});
            });
        }
        setRoundBusy(true);
        try {
            await applyRoundChanges(operations);
            S.editRoundId = null;
            S.selYearR = +season.year;
            var synced = await doSync();
            if (editing) goto("runden", document.getElementById("nav-runden"));
            else renderEntryForm();
            toast("Runde " + nr + " gespeichert (" + scores.length + " Spieler)" +
                (synced === false ? ". Bitte erneut synchronisieren." : ""), synced === false ? "err" : "ok");
        } catch(e) { toast("Speichern fehlgeschlagen: " + e.message, "err"); }
        finally { setRoundBusy(false); }
    }

    // ── Toast ─────────────────────────────────────────────────────
    function toast(msg, type) {
        type = type || "";
        var el = document.getElementById("toast");
        el.textContent = msg; el.className = "show " + type;
        clearTimeout(toast._t);
        toast._t = setTimeout(function(){ el.className = ""; }, 3000);
    }

    // ── Init ──────────────────────────────────────────────────────
    window.addEventListener("online",  function(){ document.body.classList.remove("offline"); });
    window.addEventListener("offline", function(){ document.body.classList.add("offline"); });
    if (!navigator.onLine) document.body.classList.add("offline");
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});

    (async function() {
        if (!BASE) {
            document.getElementById("sbody").innerHTML =
                '<div class="card" style="border-color:var(--accent)">' +
                '<div class="ct" style="color:var(--accent)">&#9881; config.js befüllen</div>' +
                '<p style="color:var(--muted);font-size:0.875rem;line-height:1.7">' +
                '<b>pocketbaseUrl</b> in <b>config.js</b> eintragen, dann neu laden.</p></div>';
            return;
        }
        await doSync();
    })();
</script>
</body>
</html>
